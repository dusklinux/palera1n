name: Arch Linux x86_64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s tests -v

  linux-x86_64:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install native Arch dependencies
        run: pacman -Syu --noconfirm --needed git libusb libimobiledevice libirecovery libusbmuxd libplist pkgconf vim xz
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record build versions
        run: |
          cc --version
          pkg-config --modversion libusb-1.0 libimobiledevice-1.0 libirecovery-1.0 libusbmuxd-2.0 libplist-2.0
      - name: Build Linux x86_64 only
        run: make -f Makefile.arch -j2
      - name: Exercise USB failure paths without a phone
        run: |
          make -f Makefile.arch build/test-usb build/test-pongo build/test-exploit
          build/test-usb
          build/test-pongo
          build/test-exploit
          build/palera1n-linux-x86_64 --version
      - uses: actions/upload-artifact@v7
        with:
          name: palera1n-arch-linux-x86_64
          path: build/palera1n-linux-x86_64
